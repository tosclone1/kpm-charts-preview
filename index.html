<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache">
<title>KPM Charts — Preview</title>
<style>:root{--a:#e6007e}body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#fafafa;color:#222}header{background:#111;color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}header b{color:#f5c}header a{color:#fff;text-decoration:none}main{max-width:1100px;margin:auto;padding:14px}.note{background:#fff3cd;padding:8px 10px;border-radius:6px}table{border-collapse:collapse;width:100%;background:#fff}td,th{border-bottom:1px solid #eee;padding:5px;text-align:left}.scroll{overflow-x:auto}.tag{font-size:12px;border-radius:3px;padding:1px 5px;background:#eee}.pub{background:#d4f5e2}.meta{background:#ffe1e1}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.card{background:#fff;border:1px solid #eee;border-radius:8px;padding:10px}@media(max-width:600px){td,th{font-size:13px;padding:4px}}</style>
<header><b>KPM Charts · Preview</b><a href="#/">Charts</a><a href="#/boxoffice">Taiwan Box Office</a><a href="#/pageviews">Wikipedia Pageviews</a><a href="#/methodology">Coverage &amp; Methodology</a></header><main id=m>Loading…</main>
<script>
let V='';const E=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),J=n=>fetch('data/'+n+'.json?v='+V,{cache:'no-store'}).then(r=>r.ok?r.json():null);
const tbl=(rows,cols)=>rows&&rows.length?`<div class=scroll><table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p class=note>No published data for this view yet.</p>';
const LV={ROWS:'<span class="tag pub">Full data public</span>',META:'<span class="tag meta">Rankings not public — redistribution rights pending</span>'};
async function charts(){const f=await J('chart_families');const g={};f.forEach(x=>(g[x.platform_label]??=[]).push(x));
m.innerHTML='<h2>Chart families</h2><p class=note>This preview lists the charts we track. Rankings from sources whose redistribution rights are not yet confirmed are not shown publicly.</p>'+Object.entries(g).map(([p,xs])=>`<h3>${E(p)} ${LV[xs[0].publish_level]||''}</h3><div class=cards>${xs.map(x=>`<div class=card><b>${E(x.name)}</b><br>${E(x.content_label)} · ${x.countries} ${x.countries>1?'markets':'market'}<br><small>${x.snapshots} snapshots · latest ${E((x.latest||'').slice(0,10))}</small>${x.countries>1?`<details><summary>markets</summary><small>${E(x.country_list)}</small></details>`:''}</div>`).join('')}</div>`).join('')}
async function boxoffice(){const d=await J('boxoffice_tw'),mt=await J('boxoffice_meta'),me=await J('meta');if(!d)return m.innerHTML='<p class=note>Not published.</p>';const k=location.hash.includes('all')?d:d.filter(r=>r.is_korean);
m.innerHTML=`<h2>Taiwan Box Office (cumulative)</h2><p>${E(me.attribution_tfai)}. Figures are cumulative admissions/revenue as of ${E((mt[mt.length-1].period_end||'').slice(0,10))}. Weekly figures will appear once two consecutive snapshots exist. “Korean film” is our derived classification.</p><p><a href="#/boxoffice${location.hash.includes('all')?'':'?all'}">${location.hash.includes('all')?'Korean films only':'Show all films'}</a></p>`+tbl(k.slice(0,300),[['Film',r=>E(r.name)],['Release',r=>E((r.release_date||'').slice(0,10))],['Cum. admissions',r=>(r.total_tickets??'').toLocaleString()],['Cum. revenue (TWD)',r=>(r.total_amounts??'').toLocaleString()],['Korean',r=>r.is_korean?'✓':'']])}
async function pageviews(){const d=await J('pageviews'),me=await J('meta');if(!d)return m.innerHTML='<p class=note>Not published.</p>';const g={};d.forEach(r=>{const k=r.qid+'|'+r.project+'|'+r.page;(g[k]??={qid:r.qid,project:r.project,page:r.page,views:0,days:0,start:r.date,end:r.date});g[k].views+=r.views;g[k].days++;g[k].end=r.date});
m.innerHTML=`<h2>Wikipedia pageviews (ko/ja/zh)</h2><p>${E(me.attribution_wikimedia)}. Interest signal only — not ratings, box office, or chart rank.</p>`+tbl(Object.values(g).sort((a,b)=>b.views-a.views),[['Page',r=>E(r.page)],['Wiki',r=>E(r.project)],['Wikidata',r=>E(r.qid)],['Views',r=>r.views.toLocaleString()],['Days',r=>r.days],['Range',r=>E(r.start+' – '+r.end)]])}
async function methodology(){const c=await J('coverage'),me=await J('meta');const days={};c.forEach(r=>{(days[r.run_day]??={ok:0,miss:0});r.state=='COLLECTED'?days[r.run_day].ok+=r.n:days[r.run_day].miss+=r.n});
m.innerHTML=`<h2>Coverage &amp; Methodology</h2><p>We collect public charts daily, keep every original response with a hash, and never overwrite history. Periods not stated by a source are shown as unknown. Items are not merged across sources unless verified. ${E(me.qa)}. Generated ${E(me.generated_at)}.</p><h3>Publication policy</h3>`+tbl(Object.entries(me.policy).map(([k,v])=>({k,...v})),[['Source',r=>E(r.k)],['Public level',r=>LV[r.level]],['Rights',r=>E(r.rights)]])+'<h3>Daily collection</h3>'+tbl(Object.entries(days).map(([d,v])=>({d,...v})),[['Day',r=>r.d],['Fetches collected',r=>r.ok],['Not collected / pending',r=>r.miss]])}
async function route(){if(!V){const me=await fetch('data/meta.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json());V=encodeURIComponent(me.generated_at)}const h=location.hash.split('?')[0];({'#/boxoffice':boxoffice,'#/pageviews':pageviews,'#/methodology':methodology}[h]||charts)()}
onhashchange=route;route();
</script>
